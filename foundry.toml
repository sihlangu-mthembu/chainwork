[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
libs = ["lib"]
# Aevum (cdk-erigon validium) has no Cancun opcodes: MCOPY, TSTORE/TLOAD, BLOBBASEFEE are invalid.
# See docs/CONTEXT.md. Never change this to cancun.
evm_version = "shanghai"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
cbor_metadata = true
# The coverage test drives ~2,000 handler steps in one transaction.
gas_limit = "18446744073709551615"
remappings = [
  "@chainwork/interfaces/=interfaces/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
allow_paths = ["interfaces"]
fs_permissions = [{ access = "read", path = "./contracts/test/fixtures" }, { access = "read-write", path = "./deployments" }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
aevum = "https://rpc-test.qday.info"
