name: video-capture
on:
  push:
    branches: [video-capture]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i playwright@1.49.1 && npx playwright install --with-deps chromium
        working-directory: capture
      - run: node capture.mjs
        env:
          JOBS: "10"
        working-directory: capture
      - name: Push to video-assets-10
        working-directory: capture/out
        run: |
          git init -q -b video-assets-10
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "video capture ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" video-assets-10
