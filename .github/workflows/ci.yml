name: ci

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build (shanghai, solc 0.8.28)
        run: forge build --sizes
      - name: Test (unit + fuzz + invariants, against Circle FiatToken V2.2 bytecode)
        run: forge test -vv

  sdk-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -F @chainwork/types typecheck && pnpm -F @chainwork/sdk typecheck
      - name: Local chain (shanghai) + deploy
        run: |
          anvil --hardfork shanghai --silent &
          sleep 2
          forge script contracts/script/Deploy.s.sol:DeployLocal --rpc-url http://127.0.0.1:8545 --broadcast
      - name: SDK unit + end-to-end tests
        run: CHAINWORK_LOCAL=1 pnpm -F @chainwork/sdk test
      - name: Deployed bytecode == source
        run: scripts/verify-bytecode.sh deployments/local.json http://127.0.0.1:8545

  workspace:
    name: services, agents, dashboard (fresh chain per package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: forge build >/dev/null
      - name: Typecheck everything
        run: pnpm -r typecheck
      - name: Tests (each package on its own anvil, 1 s blocks)
        run: scripts/test-local.sh
      - name: Dashboard production build
        run: pnpm -F dashboard build

  demo:
    name: demo scenarios S0-S5 end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: forge build >/dev/null
      - name: Run every scenario on a fresh chain
        run: scripts/demo-local.sh all | tee demo.log
      - name: Summary
        if: always()
        run: grep -E "^(PASS|FAIL)" demo.log >> "$GITHUB_STEP_SUMMARY" || true

  compose:
    name: docker compose up (clean clone)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and run chain + deploy + demo
        run: docker compose up --build --exit-code-from demo chain deploy demo
