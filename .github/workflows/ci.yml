name: ci

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build (shanghai, solc 0.8.28)
        run: forge build --sizes
      - name: Test (unit + fuzz + invariants)
        run: forge test -vv

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Typecheck shared types
        run: npx -y -p typescript@5 tsc --noEmit --strict --target es2022 --module esnext packages/types/src/index.ts
